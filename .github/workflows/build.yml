name: build-ttnode-image

# 每周一自动构建（拉取 CDN 最新 ttmanager），也可在 Actions 页手动触发
on:
  push:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'run.sh'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '17 3 * * 1'   # UTC 03:17 = 北京时间 11:17
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 计算镜像名（小写）与日期标签
        run: |
          echo "IMAGE_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "DATE_TAG=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（用于 arm/arm64 构建）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            UPDATE_IMAGE=${{ env.IMAGE_LC }}:latest
          tags: |
            ${{ env.IMAGE_LC }}:latest
            ${{ env.IMAGE_LC }}:${{ env.DATE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
